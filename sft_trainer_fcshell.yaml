data:
  train_batch_size: 2
  dataloader_num_workers: 8
  val_batch_size: 8
  seed: 1
  traindata_shuffle: True
  train_files: /mnt/yuhang/SFT/fcshell_parquet_0626/fcshell_test_data.parquet
  val_files: /mnt/yuhang/SFT/fcshell_parquet_0626/fcshell_test_data.parquet
  # Single-turn settings
  prompt_key: prompt
  response_key: answer
  multiturn:
    enable: false  # Set to true to use multi-turn dataset
    messages_key: messages  # Key for messages list in multi-turn mode
  max_length: 300 # Maximum sequence length for input, for kql: 8192, for fcshell: 300
  truncation: right
  balance_dp_token: false
  chat_template: null
  custom_cls:
    path: null
    name: null
model:
  model_path: Qwen/Qwen2.5-Coder-7B-Instruct
  use_fsdp: true
  fsdp_config:
    wrap_policy:
      min_num_params: 0
    cpu_offload: false
    offload_params: false
    fsdp_size: -1
    param_offload: false
    model_dtype: fp32
    optimizer_offload: false
    fsdp_strategy: fsdp #['fsdp', 'fsdp2']
    reshard_after_forward: true
    mixed_precision: true
  external_lib: null
  enable_gradient_checkpointing: false
  trust_remote_code: true
  lora_rank: 0  # Set to positive value to enable LoRA (e.g., 32)
  lora_alpha: 16  # LoRA scaling factor
  target_modules: all-linear  # Target modules for LoRA adaptation
  use_liger: false
  use_remove_padding: false
  use_fused_kernels: false
  checkpoint:
    contents: ['model', 'optimizer', 'scheduler', 'extra']
optim:
  lr: 1e-5
  betas: [0.9, 0.95]
  weight_decay: 0.1
  warmup_steps_ratio: 0.1
  clip_grad: 1.0
  lr_scheduler: cosine
ulysses_sequence_parallel_size: 1
trainer:
  ckpt_save_dir: /mnt/yuhang/SFT/system_ckpt 
  default_hdfs_dir: hdfs://tmp/experiments/gsm8k/gemma-1.1-7b-it/ # change the hdfs path here
  resume_path: null
  project_name: gsm8k-sft
  experiment_name: gsm8k-experiment
  total_epochs: 50
  logger: ['wandb']
  seed: 1
  mode: train #['inference', 'train']
  n_gpus_per_node: 1
  nnodes: 1
  resume_mode: disable
  ray_wait_register_center_timeout: 300
  device: cuda
  save_every_n_epochs: 1
  run_evaluation: false
  eval_every_n_epochs: 1
  max_ckpt_to_keep: 10  
ray_init:
  num_cpus: null # None means use all available CPUs
