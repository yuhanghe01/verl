data:
  train_batch_size: 128
  micro_batch_size: null # will be deprecated, use micro_batch_size_per_gpu
  micro_batch_size_per_gpu: 128  # this is also val batch size
  dataloader_num_workers: 8
  val_batch_size: 12
  seed: 1
  traindata_shuffle: True
  train_files: ~/data/gsm8k/train.parquet
  val_files: ~/data/gsm8k/test.parquet
  # Single-turn settings
  prompt_key: question
  response_key: answer
  prompt_dict_keys: ['question']
  response_dict_keys: ['answer']
  # Multi-turn settings
  multiturn:
    enable: false  # Set to true to use multi-turn dataset
    messages_key: messages  # Key for messages list in multi-turn mode
  max_length: 4096
  truncation: right
  balance_dp_token: false
  chat_template: null
  custom_cls:
    path: null
    name: null
  trust_remote_code: true
model:
  partial_pretrain: false
  model_path: Qwen/Qwen2.5-0.5B-Instruct
  use_fsdp: true
  fsdp_config:
    wrap_policy:
      min_num_params: 0
    cpu_offload: false
    offload_params: false
    fsdp_size: -1
    param_offload: false
    model_dtype: fp32
    optimizer_offload: false
    fsdp_strategy: fsdp #['fsdp', 'fsdp2']
    reshard_after_forward: true
  external_lib: null
  enable_gradient_checkpointing: false
  trust_remote_code: true
  lora_rank: 0  # Set to positive value to enable LoRA (e.g., 32)
  lora_alpha: 16  # LoRA scaling factor
  target_modules: all-linear  # Target modules for LoRA adaptation
  use_liger: false
  use_remove_padding: false
  use_fused_kernels: false
  checkpoint:
    contents: ['model', 'optimizer', 'scheduler', 'extra']
optim:
  lr: 1e-5
  betas: [0.9, 0.95]
  weight_decay: 0.1
  warmup_steps_ratio: 0.1
  clip_grad: 1.0
  lr_scheduler: cosine
ulysses_sequence_parallel_size: 1
trainer:
  ckpt_save_dir: /datadisk/SFT/gsm8k_SFT/
  default_hdfs_dir: hdfs://tmp/experiments/gsm8k/gemma-1.1-7b-it/ # change the hdfs path here
  resume_path: null
  project_name: gsm8k-sft
  experiment_name: test
  total_epochs: 50
  logger: ['console']
  seed: 1
  mode: train #['inference', 'train']
  n_gpus_per_node: 1
  nnodes: 1
  resume_mode: disable
  ray_wait_register_center_timeout: 300
  device: cuda
  save_every_n_epochs: 10
  run_evaluation: true
  eval_every_n_epochs: 5
  max_ckpt_to_keep: 10  
ray_init:
  num_cpus: null # None means use all available CPUs
